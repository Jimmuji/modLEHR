[project]
name = "modlehr"
version = "0.1.0"
description = "A flexible framework for modeling longitudinal EHR data in MEDS format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "meds>=0.4",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
modlehr = "modlehr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modlehr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
