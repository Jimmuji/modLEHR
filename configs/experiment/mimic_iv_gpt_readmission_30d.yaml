# Fine-tune the plain GPT of mimic_iv_gpt.yaml on 30-day readmission after a discharge alive (MC2 in Pollet &
# McDermott, arXiv 2609.18134; configs/tasks/mimic_iv/readmission_30d.yaml), from the labels ACES writes into
# the official ETL's directory (scripts/fir/aces.sbatch on Fir). Same patients and split as the paper.
#   modlehr finetune --config configs/experiment/mimic_iv_gpt_readmission_30d.yaml --seed 1 \
#     --set finetune.init=runs/mimic_iv_gpt_s1/best.pt
# The supervised baseline (the same model from scratch): --set finetune.init=null and another train.out_dir.
defaults: [mimic_iv_gpt.yaml]
finetune:
  labels: data/mimic_iv_meds/tasks/readmission_30d
  init: runs/mimic_iv_gpt_s1/best.pt
train:
  out_dir: runs/mimic_iv_gpt_readmission_30d
  batch_size: 64
  lr: 1.0e-4
  min_lr: 1.0e-5
  warmup: 500
  steps: 20000          # 3 passes over the 426,065 training samples
  eval_every: 1000      # tuning AUROC over all 53,695 tuning samples
  patience: 5
