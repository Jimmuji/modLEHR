# Model-size curve: the plain GPT of mimic_iv_core_gpt.yaml at width 128 with 4 layers and 2 heads, with the
# same data, schedule and evaluation (the plain GPT is 256 wide with 6 layers). scripts/fir/scaling.sh trains
# it on 10% to 100% of the training subjects (train.data_fraction).
defaults: [mimic_iv_core_gpt.yaml]
model:
  d_model: 128
  n_layers: 4
  n_heads: 2
train:
  out_dir: runs/mimic_iv_core_gpt_xs
