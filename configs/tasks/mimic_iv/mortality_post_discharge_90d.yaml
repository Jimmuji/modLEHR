# ACES task: death within 90 days of a discharge alive (MC10 in Pollet & McDermott, arXiv 2609.18134),
# on the official MIMIC_IV_MEDS ETL (data/mimic_iv_meds). Same samples as readmission_30d.yaml. Deaths
# outside the hospital come from state records and are dated to the day, which MIMIC-IV covers for a year
# after each patient's last discharge, so 90 days needs no censoring requirement.
predicates:
  hospital_discharge:
    code: {regex: "^HOSPITAL_DISCHARGE//.*"}
  died_in_hospital:
    code: HOSPITAL_DISCHARGE//DIED
  death:
    code: MEDS_DEATH

trigger: hospital_discharge

windows:
  input:
    start: null
    end: trigger
    start_inclusive: True
    end_inclusive: True
    index_timestamp: end
    has:
      died_in_hospital: (None, 0)
      death: (None, 0)
  target:
    start: trigger
    end: start + 90d
    start_inclusive: False
    end_inclusive: True
    label: death
