# A small GPT on the toy dataset: every stage in about half a minute on a laptop CPU.
defaults: [../data/toy.yaml, ../model/gpt_baseline.yaml]
model:
  d_model: 64
  n_layers: 2
  n_heads: 2
  max_len: 64
  text_encoding: hashed_bag
train:
  out_dir: runs/toy_gpt
  batch_size: 32
  steps: 300
  warmup: 30
  eval_every: 100
  eval_batches: 4
  device: cpu
evaluate:
  landmarks: [50, 60, 70]
  horizon_years: 10
  min_cases: 10
